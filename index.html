<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Pulse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@500;600&display=swap');
:root{--bg:#07070b;--pink:#ff2d70;--cyan:#25f4ee;--green:#57f287;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:#f7f7fb;font-family:"DM Sans",sans-serif;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
.shell{width:min(720px,100%)}
h1{font-family:"Space Grotesk";font-size:clamp(32px,7vw,48px);text-align:center;margin:20px 0 8px;letter-spacing:-.04em}
h1 span{background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:#8e8e9e;font-size:14px;margin-bottom:28px}
.search{display:flex;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:24px}
input{flex:1;border:0;outline:0;background:#0e0e15;color:#fff;padding:14px 16px;border-radius:12px;font-size:15px}
button{border:0;border-radius:12px;padding:0 20px;background:linear-gradient(135deg,var(--cyan),#8ffefa);color:#050508;font-weight:700;cursor:pointer}
.card{background:rgba(17,17,25,.75);border:1px solid var(--line);border-radius:24px;padding:28px;backdrop-filter:blur(20px)}
.title{font-size:15px;color:#777;margin-bottom:6px}
.video-title{font-family:"Space Grotesk";font-size:18px;margin-bottom:28px}
.circle{width:220px;height:220px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:conic-gradient(var(--pink) 0deg,#222 0);position:relative;box-shadow:0 0 30px rgba(255,45,112,.2)}
.circle:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#0b0b11}
.views{position:relative;z-index:1;font-family:"Space Grotesk";font-weight:700;display:flex;justify-content:center;height:1.1em;overflow:hidden;font-size:42px}
.digit-slot{display:inline-block;height:1.1em;overflow:hidden;width:.6em;text-align:center}
.digit-inner{display:block;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.digit-inner span{display:block;height:1.1em;line-height:1.1em}
.label{text-align:center;font-size:11px;letter-spacing:.3em;color:#777;margin-bottom:8px}
.delta{text-align:center;font-size:12px;color:var(--green);margin-bottom:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:rgba(255,255,255,.04);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-family:"Space Grotesk";font-size:22px;margin-top:4px}
.likes b{color:#ff76a2}.shares b{color:var(--cyan)}
.meta{font-size:13px;color:#888}
.meta div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.meta strong{color:#eee}
.error{display:none;margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,45,112,.1);color:#ff9ab7;text-align:center;font-size:13px}
.error.show{display:block}
</style>
</head>
<body>
<div class="shell">
  <h1>Regarde une vidéo<br><span>prendre vie.</span></h1>
  <p class="sub">Colle un lien TikTok · actualisation auto toutes les 10s</p>
  <div class="search">
    <input id="url" type="url" placeholder="https://www.tiktok.com/@.../video/...">
    <button onclick="start()">Lancer</button>
  </div>
  <div class="error" id="err"></div>
  <div class="card">
    <div class="title">Vidéo suivie</div>
    <div class="video-title" id="title">En attente…</div>
    <div class="circle" id="circle">
      <div class="views" id="counter"></div>
    </div>
    <div class="label">VUES EN DIRECT</div>
    <div class="delta" id="delta">● En attente</div>
    <div class="stats">
      <div class="stat">♥ Likes<br><b id="likes">0</b></div>
      <div class="stat">↗ Partages<br><b id="shares">0</b></div>
    </div>
    <div class="meta">
      <div><span>Statut</span><strong id="status">En attente</strong></div>
      <div><span>Dernière MAJ</span><strong id="last">—</strong></div>
      <div><span>Publié le</span><strong id="pub">—</strong></div>
      <div><span>Évolution</span><strong id="growth">—</strong></div>
    </div>
  </div>
</div>
<script>
let url = "", old = null, cd = 10, t = null, digits = [], animating = false;
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString("fr-FR");

function size(n) {
  const s = n <= 4 ? 42 : n === 5 ? 36 : n === 6 ? 30 : n === 7 ? 26 : n === 8 ? 22 : 18;
  $("counter").style.fontSize = s + "px";
}

function slot(d) {
  const s = document.createElement("span");
  s.className = "digit-slot";
  s.innerHTML = `<div class="digit-inner"><span>${d}</span><span>${d}</span></div>`;
  return s;
}

function render(v) {
  const text = String(Math.max(0, Math.floor(v || 0)));
  const nd = [...text];
  size(nd.length);

  if (nd.length !== digits.length) {
    $("counter").innerHTML = "";
    nd.forEach(d => $("counter").appendChild(slot(d)));
    digits = nd;
    return;
  }

  nd.forEach((d, i) => {
    if (d === digits[i]) return;
    const inn = $("counter").children[i].querySelector(".digit-inner");
    inn.children[0].textContent = digits[i];
    inn.children[1].textContent = d;
    inn.style.transition = "none";
    inn.style.transform = "translateY(0)";
    void inn.offsetWidth;
    inn.style.transition = "transform .35s cubic-bezier(.22,1,.36,1)";
    inn.style.transform = "translateY(-50%)";
    setTimeout(() => {
      inn.children[0].textContent = d;
      inn.style.transition = "none";
      inn.style.transform = "translateY(0)";
    }, 360);
  });
  digits = nd;
}

// Animation fluide : passe par les valeurs intermédiaires
async function animateTo(target) {
  if (animating) return;
  const from = old === null ? 0 : old;
  if (target <= from) {
    render(target);
    return;
  }

  animating = true;
  const diff = target - from;
  const steps = Math.min(diff, 50);
  const stepSize = Math.ceil(diff / steps);
  const delay = diff <= 20 ? 55 : diff <= 80 ? 40 : 28;

  for (let i = 1; i <= steps; i++) {
    const next = Math.min(from + stepSize * i, target);
    render(next);
    await new Promise(r => setTimeout(r, delay));
  }
  render(target);
  animating = false;
}

function timer() {
  const deg = ((10 - cd) / 10) * 360;
  $("circle").style.background = `conic-gradient(var(--pink) ${deg}deg, #222 ${deg}deg)`;
}

function start() {
  const v = $("url").value.trim();
  if (!v) return;
  url = v;
  old = null;
  digits = [];
  render(0);
  $("likes").textContent = $("shares").textContent = "0";
  $("title").textContent = "Chargement…";
  $("delta").textContent = "● Connexion…";
  $("err").classList.remove("show");
  update();
  startT();
}

async function update() {
  if (!url) return;
  try {
    const r = await fetch("/stats?url=" + encodeURIComponent(url), { cache: "no-store" });
    const d = await r.json();
    if (d.error) throw 0;

    const views = d.views || 0;

    if (old === null || views !== old) {
      await animateTo(views);
    }

    $("likes").textContent = fmt(d.likes);
    $("shares").textContent = fmt(d.shares);
    $("title").textContent = d.title || "Vidéo TikTok";
    $("last").textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    $("status").textContent = "Actif";
    $("status").style.color = "var(--green)";

    if (d.createTime) {
      $("pub").textContent = new Date(d.createTime * 1000).toLocaleDateString("fr-FR", {
        day: "2-digit", month: "short", year: "numeric"
      });
    } else {
      $("pub").textContent = "—";
    }

    if (old !== null) {
      const diff = views - old;
      $("growth").textContent = diff > 0 ? "+" + fmt(diff) : "Stable";
      $("delta").textContent = diff > 0 ? `▲ +${fmt(diff)} vues` : "● +0 vues";
    }

    old = views;
  } catch (e) {
    $("status").textContent = "Erreur";
    $("status").style.color = "";
    $("err").textContent = "Impossible de récupérer les stats";
    $("err").classList.add("show");
  }
}

function startT() {
  clearInterval(t);
  cd = 10;
  timer();
  t = setInterval(async () => {
    cd--;
    timer();
    if (cd <= 0) {
      clearInterval(t);
      await update();
      startT();
    }
  }, 1000);
}

$("url").onkeydown = e => e.key === "Enter" && start();
render(0);
timer();
</script>
</body>
</html>
