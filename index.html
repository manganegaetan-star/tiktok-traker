
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Tracker</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at top,#252525,#050505);
font-family:Arial,sans-serif;
color:white;
}

.container{
width:90%;
max-width:700px;
margin:40px auto;
}

h1{
text-align:center;
font-size:42px;
}

.live{
width:max-content;
margin:auto;
background:#ff0050;
padding:8px 20px;
border-radius:30px;
font-weight:bold;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
padding:25px;
border-radius:25px;
margin-top:25px;
box-shadow:0 20px 50px #000;
}

input{
width:100%;
padding:16px;
border-radius:15px;
border:none;
background:#111;
color:white;
font-size:16px;
}

button{
width:100%;
margin-top:15px;
padding:16px;
border-radius:15px;
border:none;
background:#00f2ea;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.title{
text-align:center;
color:#00f2ea;
font-weight:bold;
word-break:break-word;
}

.timer{
text-align:center;
font-size:50px;
font-weight:bold;
margin:25px;
color:#ff0050;
}

.counter{
text-align:center;
font-size:75px;
font-weight:900;
color:#00f2ea;
}

.views-label{
text-align:center;
color:#888;
letter-spacing:5px;
font-size:13px;
}

.stats{
display:flex;
justify-content:space-around;
margin-top:25px;
text-align:center;
}

.stat-number{
font-size:30px;
font-weight:bold;
}

.likes{
color:#ff4d8d;
}

.shares{
color:#00f2ea;
}

.stat-title{
color:#888;
}

</style>

</head>


<body>


<div class="container">


<h1>
🎵 TikTok Tracker
</h1>


<div class="live">
● LIVE
</div>



<div class="card">

<input id="url" placeholder="Colle ton lien TikTok">

<button onclick="startTracking()">
🚀 Suivre
</button>

</div>



<div class="timer" id="timer">
10
</div>



<div class="card">

<div id="title" class="title">
Titre vidéo
</div>

</div>



<div class="card">


<div id="counter" class="counter">
0
</div>


<div class="views-label">
VUES
</div>



<div class="stats">


<div>

<div id="likes" class="stat-number likes">
0
</div>

<div class="stat-title">
❤️ Likes
</div>

</div>



<div>

<div id="shares" class="stat-number shares">
0
</div>

<div class="stat-title">
🔄 Partages
</div>

</div>


</div>


</div>


</div>



<script>


let url="";

let oldViews=0;

let countdown=10;

let timerInterval;

let running=false;



async function update(){


try{


let res = await fetch(
"/stats?url=" + encodeURIComponent(url)
);



let data = await res.json();



console.log(data);



if(data.error){

console.log(data.error);

return;

}



let views = Number(data.views);



if(views !== oldViews){

document.getElementById("counter").innerHTML =
views.toLocaleString();

oldViews = views;

}



document.getElementById("likes").innerHTML =
Number(data.likes).toLocaleString();



document.getElementById("shares").innerHTML =
Number(data.shares).toLocaleString();



document.getElementById("title").innerHTML =
data.title;



}

catch(error){

console.log("Erreur API :",error);

}


}




function updateTimer(){

document.getElementById("timer").innerHTML =
countdown;

}






async function startTimer(){


clearInterval(timerInterval);


countdown=10;

updateTimer();



timerInterval=setInterval(async()=>{


countdown--;

updateTimer();



if(countdown<=0){


clearInterval(timerInterval);



await update();



countdown=10;


startTimer();



}



},1000);



}





function startTracking(){


url=document.getElementById("url").value.trim();



if(!url)return;



oldViews=0;



document.getElementById("counter").innerHTML="0";



startTimer();



}




</script>


</body>

</html>
