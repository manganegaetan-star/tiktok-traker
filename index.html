
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Tracker</title>

<style>

/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #252525, #050505);

    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    font-size: 42px;
}

.live {
    width: max-content;
    margin: auto;

    background: #ff0050;

    padding: 8px 20px;

    border-radius: 30px;

    font-weight: bold;
}


/* =========================
   CARDS
========================= */

.card {
    background: rgba(255,255,255,.08);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,.1);

    padding: 25px;

    border-radius: 25px;

    margin-top: 25px;

    box-shadow: 0 20px 50px #000;
}


/* =========================
   INPUT
========================= */

input {
    width: 100%;

    padding: 16px;

    border-radius: 15px;

    border: none;

    background: #111;

    color: white;

    font-size: 16px;

    outline: none;
}

input:focus {
    box-shadow: 0 0 0 2px #00f2ea;
}


/* =========================
   BUTTON
========================= */

button {
    width: 100%;

    margin-top: 15px;

    padding: 16px;

    border-radius: 15px;

    border: none;

    background: #00f2ea;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);

    filter: brightness(1.1);
}

button:active {
    transform: scale(.98);
}


/* =========================
   TITLE
========================= */

.title {
    text-align: center;

    color: #00f2ea;

    font-weight: bold;

    word-break: break-word;
}


/* =========================
   TIMER ROULEAU
========================= */

.timer-area {
    display: flex;

    justify-content: center;

    align-items: center;

    margin: 25px;
}

.timer-circle {
    width: 80px;
    height: 80px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        conic-gradient(
            #ff0050 360deg,
            #333 0deg
        );

    transition: background .3s linear;
}

.timer-window {
    width: 60px;
    height: 60px;

    border-radius: 50%;

    background: #050505;

    overflow: hidden;

    display: flex;

    justify-content: center;
}

.timer-roller {
    transition:
        transform .7s cubic-bezier(.22,1,.36,1);
}

.timer-number {
    height: 60px;
    width: 60px;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 28px;

    font-weight: bold;
}


/* =========================
   COMPTEUR DE VUES
========================= */

.counter {
    display: flex;

    justify-content: center;

    align-items: flex-start;

    height: 90px;

    overflow: hidden;

    font-size: 75px;

    font-weight: 900;

    color: #00f2ea;

    direction: ltr;

    white-space: nowrap;
}


/*
   UNE COLONNE = UN CHIFFRE
*/

.digit {
    width: 50px;

    height: 90px;

    overflow: hidden;

    position: relative;

    flex-shrink: 0;
}


/*
   ROULEAU DE 0 À 9
*/

.roller {
    transition:
        transform .8s cubic-bezier(.22,1,.36,1);

    will-change: transform;
}


/*
   CHAQUE CHIFFRE
*/

.number {
    height: 90px;

    width: 50px;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================
   ANIMATION FLASH
========================= */

.flash {
    animation: flash .5s;
}

@keyframes flash {

    50% {
        color: #00ff88;

        transform: scale(1.12);
    }

}


/* =========================
   LABEL VUES
========================= */

.views-label {
    text-align: center;

    color: #888;

    letter-spacing: 5px;

    font-size: 13px;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;

    justify-content: space-around;

    margin-top: 25px;

    text-align: center;
}

.stat-number {
    font-size: 30px;

    font-weight: bold;
}

.likes {
    color: #ff4d8d;
}

.shares {
    color: #00f2ea;
}

.stat-title {
    color: #888;

    font-size: 14px;
}


/* =========================
   ANIMATION NOUVEAU CHIFFRE
========================= */

.counter-grow {
    animation:
        counterGrow .4s cubic-bezier(.22,1,.36,1);
}

@keyframes counterGrow {

    0% {
        transform: scale(.9);
        opacity: .5;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }

}


/* =========================
   RESPONSIVE MOBILE
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 32px;
    }

    .counter {
        font-size: 55px;
        height: 70px;
    }

    .digit {
        width: 38px;
        height: 70px;
    }

    .number {
        width: 38px;
        height: 70px;
    }

    .card {
        padding: 20px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         TITRE
    ========================== -->

    <h1>
        🎵 TikTok Tracker
    </h1>


    <div class="live">
        ● LIVE
    </div>



    <!-- =========================
         RECHERCHE
    ========================== -->

    <div class="card">

        <input
            id="url"
            placeholder="Colle ton lien TikTok"
        >

        <button onclick="startTracking()">
            🚀 Suivre
        </button>

    </div>



    <!-- =========================
         TIMER
    ========================== -->

    <div class="timer-area">

        <div
            id="timerCircle"
            class="timer-circle"
        >

            <div class="timer-window">

                <div
                    id="timerRoller"
                    class="timer-roller"
                >

                    <div class="timer-number">
                        10
                    </div>

                    <div class="timer-number">
                        9
                    </div>

                    <div class="timer-number">
                        8
                    </div>

                    <div class="timer-number">
                        7
                    </div>

                    <div class="timer-number">
                        6
                    </div>

                    <div class="timer-number">
                        5
                    </div>

                    <div class="timer-number">
                        4
                    </div>

                    <div class="timer-number">
                        3
                    </div>

                    <div class="timer-number">
                        2
                    </div>

                    <div class="timer-number">
                        1
                    </div>

                    <div class="timer-number">
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         TITRE VIDEO
    ========================== -->

    <div class="card">

        <div
            id="title"
            class="title"
        >
            Titre vidéo
        </div>

    </div>



    <!-- =========================
         VUES
    ========================== -->

    <div class="card">

        <div
            id="counter"
            class="counter"
        >
        </div>


        <div class="views-label">
            VUES
        </div>



        <!-- =========================
             STATS
        ========================== -->

        <div class="stats">


            <div>

                <div
                    id="likes"
                    class="stat-number likes"
                >
                    0
                </div>

                <div class="stat-title">
                    ❤️ Likes
                </div>

            </div>



            <div>

                <div
                    id="shares"
                    class="stat-number shares"
                >
                    0
                </div>

                <div class="stat-title">
                    🔄 Partages
                </div>

            </div>


        </div>

    </div>


</div>



<script>


/* =========================
   VARIABLES
========================= */

let url = "";

let oldViews = 0;

let rollers = [];

let countdown = 10;

let timerInterval;


/* =========================
   CRÉATION DU COMPTEUR
========================= */

function createCounter(value) {

    const box = document.getElementById("counter");

    box.innerHTML = "";

    rollers = [];

    const text = String(value);


    /*
       On crée une colonne
       pour chaque chiffre.
    */

    for (let char of text) {

        const digit = document.createElement("div");

        digit.className = "digit";


        const roller = document.createElement("div");

        roller.className = "roller";


        /*
           Création des chiffres 0 → 9
        */

        for (let i = 0; i <= 9; i++) {

            const number = document.createElement("div");

            number.className = "number";

            number.textContent = i;

            roller.appendChild(number);
        }


        /*
           Position initiale
        */

        roller.style.transform =
            `translateY(-${Number(char) * 90}px)`;


        digit.appendChild(roller);

        box.appendChild(digit);

        rollers.push(roller);
    }

}


/* =========================
   ANIMATION DU COMPTEUR
========================= */

function animateCounter(value) {

    const text = String(value);


    /*
       Si le nombre de chiffres change,
       on recrée les colonnes.
       
       Exemple :
       
       99
       ↓
       100
    */

    if (rollers.length !== text.length) {

        const oldLength = rollers.length;

        createCounter(value);


        /*
           Animation d'apparition
           lorsqu'un nouveau chiffre apparaît.
        */

        if (text.length > oldLength) {

            const box =
                document.getElementById("counter");


            box.classList.remove("counter-grow");

            void box.offsetWidth;

            box.classList.add("counter-grow");
        }

        return;
    }


    /*
       Sinon on anime chaque colonne.
    */

    for (let i = 0; i < text.length; i++) {

        const digit = Number(text[i]);


        rollers[i].style.transform =
            `translateY(-${digit * 90}px)`;
    }

}


/* =========================
   TIMER
========================= */

function updateTimer() {

    const roller =
        document.getElementById("timerRoller");


    /*
       Position du chiffre.
    */

    roller.style.transform =
        `translateY(-${(10 - countdown) * 60}px)`;


    /*
       Cercle rouge.
    */

    const deg =
        (countdown / 10) * 360;


    document
        .getElementById("timerCircle")
        .style.background =
        `conic-gradient(
            #ff0050 ${deg}deg,
            #333 ${deg}deg
        )`;

}


/* =========================
   DÉMARRAGE TIMER
========================= */

function startTimer() {

    countdown = 10;

    updateTimer();


    clearInterval(timerInterval);


    timerInterval = setInterval(async () => {

        countdown--;

        updateTimer();


        if (countdown <= 0) {

            clearInterval(timerInterval);


            /*
               Récupération des statistiques.
            */

            await update();


            /*
               Nouveau cycle.
            */

            countdown = 10;

            updateTimer();

            startTimer();
        }

    }, 1000);

}


/* =========================
   RÉCUPÉRATION DES STATS
========================= */

async function update() {

    try {

        const res =
            await fetch(
                "/stats?url=" +
                encodeURIComponent(url)
            );


        /*
           Vérification HTTP.
        */

        if (!res.ok) {

            throw new Error(
                "Erreur serveur : " + res.status
            );
        }


        const data =
            await res.json();


        /*
           Nombre de vues.
        */

        const views =
            Number(data.views) || 0;


        /*
           Animation uniquement
           si le nombre a changé.
        */

        if (views !== oldViews) {

            const box =
                document.getElementById("counter");


            /*
               Flash vert.
            */

            box.classList.remove("flash");

            void box.offsetWidth;

            box.classList.add("flash");


            /*
               Animation rouleau.
            */

            animateCounter(views);


            oldViews = views;
        }


        /*
           Likes.
        */

        document.getElementById("likes").textContent =
            Number(data.likes || 0).toLocaleString();


        /*
           Partages.
        */

        document.getElementById("shares").textContent =
            Number(data.shares || 0).toLocaleString();


        /*
           Titre.
        */

        document.getElementById("title").textContent =
            data.title || "Titre vidéo";


    } catch (error) {

        console.error(
            "Erreur lors de la récupération des statistiques :",
            error
        );

    }

}


/* =========================
   DÉMARRER LE TRACKING
========================= */

function startTracking() {

    url =
        document
            .getElementById("url")
            .value
            .trim();


    /*
       Aucun lien.
    */

    if (!url) {

        return;
    }


    /*
       Réinitialisation.
    */

    oldViews = 0;


    createCounter(0);


    /*
       Première récupération
       immédiate.
    */

    update();


    /*
       Puis timer.
    */

    startTimer();

}


/* =========================
   INITIALISATION
========================= */

createCounter(0);

updateTimer();


</script>

</body>

</html>
